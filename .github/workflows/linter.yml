name: Lint Code Base
on:
  pull_request: ~
  push:
    branches:
      - main

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest
    concurrency:
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: selene
          no-default-features: true

      - name: Lint Code Base(Lua)
        run: |
          selene . -q
