name: Lint Code Base
on:
  pull_request: ~
  push:

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: selene

      - name: Lint Code Base(Lua)
        run: |
          selene . -q
